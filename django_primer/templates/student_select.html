<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% if delete_mode %}Удалить{% else %}Редактировать{% endif %} студента</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css">
</head>
<body>
    <div class="container" style="margin-top: 50px;">
        <h2>
            {% if delete_mode %}
                Удалить студента
            {% else %}
                Редактировать студента
            {% endif %}
        </h2>
        
        <form method="post" style="max-width: 600px;">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="student_id">Выберите студента:</label>
                <select name="student_id" id="student_id" class="form-control" required>
                    <option value="">--- Выберите студента ---</option>
                    {% for student in students %}
                        <option value="{{ student.id }}">
                            {{ student.fio }} ({{ student.email }})
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <button type="submit" class="btn {% if delete_mode %}btn-danger{% else %}btn-warning{% endif %}">
                {% if delete_mode %}
                    Удалить студента
                {% else %}
                    Перейти к редактированию
                {% endif %}
            </button>
            
            <a href="/" class="btn btn-default">Отмена</a>
        </form>
    </div>
</body>
</html>
