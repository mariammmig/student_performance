<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% if form.instance.pk %}Редактировать{% else %}Добавить{% endif %} предмет</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css">
</head>
<body>
    <div class="container" style="margin-top: 50px; max-width: 600px;">
        <h2>{% if form.instance.pk %}Редактировать{% else %}Добавить{% endif %} предмет</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">Сохранить</button>
            <a href="/" class="btn btn-default">Отмена</a>
        </form>
    </div>
</body>
</html>
