<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% if delete_mode %}Удалить{% else %}Редактировать{% endif %} предмет</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.4/css/bootstrap.min.css">
</head>
<body>
    <div class="container" style="margin-top: 50px; max-width: 600px;">
        <h2>
            {% if delete_mode %}
                Удалить предмет
            {% else %}
                Редактировать предмет
            {% endif %}
        </h2>
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Выберите предмет:</label>
                <select name="subject_id" class="form-control" required>
                    <option value="">--- Выберите предмет ---</option>
                    {% for subject in subjects %}
                        <option value="{{ subject.id }}">{{ subject.name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <button type="submit" class="btn {% if delete_mode %}btn-danger{% else %}btn-warning{% endif %}">
                {% if delete_mode %}Удалить{% else %}Перейти к редактированию{% endif %}
            </button>
            <a href="/" class="btn btn-default">Отмена</a>
        </form>
    </div>
</body>
</html>
